<!Doctype html>
<html>
	<head>
		<style>
			#contenedor{display:flex;align-items:flex-end;}
			.barra{background:red;height:20px;border-radius:8px;margin:6px;color:white;padding:10px;}
		</style>
	</head>
	<body>
		<div id="contenedor"></div>
		<script>
			let datos = [34,65,76,87,54,34,43];
			let contenedor = document.querySelector("#contenedor")
			datos.forEach(function(dato){
				contenedor.innerHTML += `
					<div class="barra" style="width:`+dato+`px;">
						`+dato+`
					</div>`;
			})
		</script>
	</body>
</html>
