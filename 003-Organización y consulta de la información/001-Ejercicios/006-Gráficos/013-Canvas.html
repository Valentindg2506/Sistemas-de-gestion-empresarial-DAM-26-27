<!doctype html>
<html>
	<head>
		<style>
			.contenedor{display:flex;align-items:flex-end;margin:50px;}
			.barra{background:red;width:20px;border-radius:8px;margin:6px;color:white;padding:10px;}
		</style>
	</head>
	<body>
		<canvas width=512 height=512></canvas>
		<script>
			let lienzo = document.querySelector("canvas")
			let contexto = lienzo.getContext("2d")

			contexto.fillStyle = "Orangered"
			contexto.beginPath();
			contexto.arc(50,50,20,0,Math.PI*2)
			contexto.fill()
		</script>
	</body>
</html>
